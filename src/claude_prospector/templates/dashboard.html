<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Usage — Economy</title>

{# Vendored Chart.js 4 and chartjs-chart-treemap, inlined for offline use #}
<script>{{ chart_js | safe }}</script>
<script>{{ treemap_js | safe }}</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0d1117; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
      'Segoe UI', Roboto, sans-serif;
    color: #c9d1d9;
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  ::selection { background: rgba(210,168,255,0.35); color: #f0f6fc; }

  .stage { max-width: 1600px; margin: 0 auto; padding: 24px; }

  /* Shell — page title + view toggle */
  .shell-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 1px solid #21262d;
  }
  .shell-head .titles h1 {
    font-size: 24px; color: #f0f6fc; font-weight: 600;
    letter-spacing: -0.02em;
  }
  .shell-head .titles .sub {
    font-size: 13px; color: #8b949e; margin-top: 4px;
  }
  .shell-head .titles .sub b { color: #d2a8ff; font-weight: 500; }

  /* Segmented view toggle */
  .view-toggle {
    display: inline-flex;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 4px;
    gap: 2px;
  }
  .view-toggle button {
    background: transparent;
    border: 0;
    color: #8b949e;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .view-toggle button:hover { color: #c9d1d9; }
  .view-toggle button.active {
    background: #21262d;
    color: #f0f6fc;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset,
      0 1px 2px rgba(0,0,0,0.3);
  }
  .view-toggle button .badge {
    font-size: 10px;
    background: rgba(210,168,255,0.15);
    color: #d2a8ff;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .view-toggle button.active.advanced .badge {
    background: rgba(210,168,255,0.22);
  }

  /* Shared primitives */
  .badge-model {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.02em;
  }
  .badge-opus   { background: #3b1f6e; color: #d2a8ff; }
  .badge-sonnet { background: #1a3a2a; color: #7ee787; }
  .badge-haiku  { background: #1a2a3a; color: #79c0ff; }
  .badge-unknown{ background: #21262d; color: #8b949e; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #21262d; color: #c9d1d9;
    padding: 2px 8px; border-radius: 12px; font-size: 11px;
  }

  /* Period tabs (used inside tab views) */
  .period-tabs {
    display: inline-flex;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .period-tabs button {
    background: transparent;
    border: 0;
    color: #8b949e;
    padding: 5px 12px;
    border-radius: 5px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .period-tabs button:hover { color: #f0f6fc; }
  .period-tabs button.active { background: #21262d; color: #f0f6fc; }

  /* View container — fades on switch */
  #view-container { animation: fadein 0.25s ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* Utility classes */
  .muted { color: #8b949e; }
  .dim   { color: #6e7681; }
  .hi    { color: #f0f6fc; }
  .num   { font-variant-numeric: tabular-nums; }

  /* ── Overview (Phase 2 placeholder layout) ────────────────────────── */
  .ov-kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .ov-kpi {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .ov-kpi .label {
    font-size: 11px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .ov-kpi .value {
    font-size: 28px;
    color: #f0f6fc;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Two-column layout for model/project breakdown — collapses at 1000px */
  .row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 1000px) {
    .row { grid-template-columns: 1fr; }
  }

  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    padding: 18px 20px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .card-head h2 { font-size: 14px; color: #f0f6fc; font-weight: 600; }
  .card-head .sub { font-size: 11px; color: #8b949e; }

  /* Session table */
  .session-table { width: 100%; overflow-x: auto; overflow-y: auto; }
  .session-row {
    display: grid;
    grid-template-columns: 1fr 120px 80px 60px;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #21262d;
    align-items: center;
    font-size: 12px;
  }
  @media (max-width: 800px) {
    .session-row { grid-template-columns: 1fr 80px; }
    .session-row .sess-agent,
    .session-row .sess-model { display: none; }
  }
  .session-row:last-child { border-bottom: none; }
  .session-row .sess-project { color: #ffa657; font-weight: 500; }
  .session-row .sess-tokens {
    color: #f0f6fc; font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .session-row .sess-agent { color: #8b949e; }
  .session-row .sess-model { color: #6e7681; text-align: right; }

  /* Phase 3 placeholder card */
  .ph3-card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    color: #6e7681;
  }
  .ph3-card .ph3-title {
    font-size: 15px;
    font-weight: 600;
    color: #8b949e;
    margin-bottom: 8px;
  }
  .ph3-card .ph3-badge {
    display: inline-block;
    background: rgba(210,168,255,0.12);
    color: #d2a8ff;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    margin-bottom: 14px;
  }
  .ph3-card p { font-size: 12px; color: #6e7681; max-width: 420px; margin: 0 auto; }

  /* Budget bars hero */
  .budgets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 1000px) {
    .budgets { grid-template-columns: 1fr; }
  }
  .bcard {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .bcard::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent, #58a6ff);
  }
  .bcard .bname {
    font-size: 11px; color: #8b949e;
    text-transform: uppercase; letter-spacing: 0.04em;
    font-weight: 500; margin-bottom: 4px;
  }
  .bcard .bval {
    font-size: 26px; color: #f0f6fc; font-weight: 600;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

{# Data injected by Jinja from claude_prospector.renderer #}
<script>
  window.DATA = {{ data_json | safe }};
  {# limits_json renders the literal "null" when limits is None; coerce to {} #}
  const _limits_raw = {{ limits_json | safe }};
  window.LIMITS = _limits_raw || {};
  window.GENERATED_AT = "{{ generated_at }}";
</script>

{# Shared utilities, palette, chart defaults (window.CP) #}
<script>{{ cp_utils_js | safe }}</script>

<div class="stage">
  <div class="shell-head">
    <div class="titles">
      <h1>Economy</h1>
      <div class="sub" id="shell-sub">
        A weekly snapshot of how much you're using Claude Code.
      </div>
    </div>
    <div class="view-toggle" role="tablist" aria-label="View mode">
      <button data-view="basic" class="active" role="tab" aria-selected="true">
        Overview
      </button>
      <button data-view="detail" role="tab" aria-selected="false">
        Breakdown
      </button>
      <button data-view="advanced" class="advanced" role="tab"
        aria-selected="false">
        Advanced <span class="badge">Power user</span>
      </button>
    </div>
  </div>

  <div id="view-container"></div>
</div>

<script>
  CP.applyChartDefaults();

  const _container = document.getElementById('view-container');
  const _sub = document.getElementById('shell-sub');
  const _buttons = document.querySelectorAll('.view-toggle button');

  const _VIEW_SUBS = {
    basic:
      "A weekly snapshot of how much you're using Claude Code.",
    detail:
      "Where your tokens go — projects, agents, skills and adoption, " +
      "full session log.",
    advanced:
      "Per-turn cost lever metrics with workflow vs. cost decomposition. " +
      "<b>For users comfortable with token/cache economics.</b>",
  };

  /** Render the placeholder for tabs pending Phase 3. */
  function _renderPlaceholder(title, root) {
    root.innerHTML =
      '<div class="ph3-card">' +
        '<div class="ph3-badge">Phase 3 — coming</div>' +
        '<div class="ph3-title">' + title + '</div>' +
        '<p>Full view renderer ships in Phase 3 (issue #168). ' +
        'Data is available in <code>window.DATA</code> now.</p>' +
      '</div>';
  }

  /** Render the Overview tab using window.DATA. */
  function _renderOverview(root) {
    const d = window.DATA;
    const L = window.LIMITS || {};

    // KPI row
    const kpiHtml =
      '<div class="ov-kpi-row">' +
        _kpi('Total Tokens',
          CP.fmtTokens(d.total_tokens)) +
        _kpi('Sessions', String(d.total_sessions)) +
        _kpi('Messages', String(d.total_messages)) +
      '</div>';

    // Budget hero — only shown when limits configured
    let budgetHtml = '';
    if (L.limit_5h || L.limit_7d || L.limit_sonnet_7d) {
      const buckets = CP.computeBuckets(d.sessions, L);
      budgetHtml = '<div class="budgets">' +
        _bcard('5-hour rolling', buckets.h5, '#79c0ff') +
        _bcard('7-day rolling',  buckets.d7, '#d2a8ff') +
        _bcard('Sonnet · 7d',   buckets.son7d, '#2ea043') +
      '</div>';
    }

    // Top 5 sessions
    const topSessions = (d.sessions || [])
      .slice()
      .sort(function(a, b) { return b.total_tokens - a.total_tokens; })
      .slice(0, 5);

    const sessRows = topSessions.map(function(s) {
      const model = s.model_split
        ? Object.keys(s.model_split).reduce(
            function(a, b) {
              return s.model_split[a] > s.model_split[b] ? a : b;
            })
        : '—';
      return '<div class="session-row">' +
        '<span class="sess-project">' + _esc(s.project) + '</span>' +
        '<span class="sess-agent muted">' +
          _esc(s.root_agent || '—') + '</span>' +
        '<span class="sess-model dim">' + _esc(model) + '</span>' +
        '<span class="sess-tokens">' +
          CP.fmtTokens(s.total_tokens) + '</span>' +
      '</div>';
    }).join('');

    const sessHtml =
      '<div class="card">' +
        '<div class="card-head">' +
          '<h2>Top Sessions</h2>' +
          '<span class="sub">by token spend</span>' +
        '</div>' +
        '<div class="session-table">' +
          (sessRows || '<p class="muted" style="padding:12px 0">No sessions.</p>') +
        '</div>' +
      '</div>';

    // Model breakdown
    const models = Object.entries(d.by_model || {})
      .sort(function(a, b) {
        return b[1].total_tokens - a[1].total_tokens;
      });

    const modelRows = models.map(function(entry) {
      const name = entry[0];
      const info = entry[1];
      const pct = d.total_tokens > 0
        ? Math.round(info.total_tokens / d.total_tokens * 100)
        : 0;
      return '<div style="display:grid;grid-template-columns:' +
        '1fr 50px 80px;gap:8px;align-items:center;padding:8px 0;' +
        'border-bottom:1px solid #21262d;font-size:12px;">' +
        '<span>' +
          '<span class="badge-model badge-' + _esc(name) + '">' +
            _esc(name) + '</span>' +
        '</span>' +
        '<span class="muted num" style="text-align:right">' +
          pct + '%</span>' +
        '<span class="hi num" style="text-align:right;font-weight:600">' +
          CP.fmtTokens(info.total_tokens) + '</span>' +
      '</div>';
    }).join('');

    const modelsHtml =
      '<div class="card">' +
        '<div class="card-head"><h2>By Model</h2></div>' +
        (modelRows || '<p class="muted" style="padding:12px 0">No data.</p>') +
      '</div>';

    root.innerHTML =
      kpiHtml +
      budgetHtml +
      '<div class="row">' + sessHtml + modelsHtml + '</div>';
  }

  function _kpi(label, value) {
    return '<div class="ov-kpi">' +
      '<div class="label">' + label + '</div>' +
      '<div class="value">' + value + '</div>' +
    '</div>';
  }

  function _bcard(label, bucket, color) {
    const pct = bucket.limit
      ? Math.min(100, Math.round(bucket.value / bucket.limit * 100))
      : 0;
    return '<div class="bcard" style="--accent:' + color + '">' +
      '<div class="bname">' + label + '</div>' +
      '<div class="bval">' + CP.fmtTokens(bucket.value) + '</div>' +
      (bucket.limit
        ? '<div style="margin-top:8px;height:4px;background:#0d1117;' +
          'border-radius:3px;overflow:hidden;">' +
          '<div style="height:100%;width:' + pct + '%;background:' +
          color + ';border-radius:3px;"></div>' +
          '</div>' +
          '<div style="font-size:11px;color:#8b949e;margin-top:4px;">' +
          'of ' + CP.fmtTokens(bucket.limit) + ' (' + pct + '%)' +
          '</div>'
        : '<div style="font-size:11px;color:#6e7681;margin-top:4px;">' +
          'no limit set</div>'
      ) +
    '</div>';
  }

  function _esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function _renderView(view) {
    // Reset animation for re-trigger
    _container.style.animation = 'none';
    _container.offsetHeight; // force reflow
    _container.style.animation = '';

    _container.className = '';
    _container.innerHTML = '';

    if (view === 'basic') {
      _renderOverview(_container);
    } else if (view === 'detail') {
      _renderPlaceholder('Breakdown', _container);
    } else {
      _renderPlaceholder('Advanced', _container);
    }
    _sub.innerHTML = _VIEW_SUBS[view] || '';
  }

  function setView(view) {
    _buttons.forEach(function(b) {
      const active = b.dataset.view === view;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    _renderView(view);
  }

  _buttons.forEach(function(b) {
    b.addEventListener('click', function() { setView(b.dataset.view); });
  });

  // Allow the overview "Switch to Advanced" CTA to drive the shell
  window.addEventListener('economy:switch-view', function(e) {
    setView(e.detail.view);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  setView('basic');
</script>

</body>
</html>
